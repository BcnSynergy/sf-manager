services:
  postgres:
    image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    restart: unless-stopped
    environment:
      POSTGRES_USER: sfmanager
      POSTGRES_PASSWORD: sfmanager
      POSTGRES_DB: sfmanager
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql

  # Catches the email the API sends in development (password-reset,
  # ADR-018): with no SMTP_HOST set, the API sends to localhost:1025, and the
  # messages show at http://localhost:8025. Nothing leaves the machine. Bound
  # to loopback only: the UI has no login and will show reset links.
  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  postgres-data:
