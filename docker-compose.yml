services:
  postgres:
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    restart: unless-stopped
    environment:
      POSTGRES_USER: sfmanager
      POSTGRES_PASSWORD: sfmanager
      POSTGRES_DB: sfmanager
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql

  # Catches the email the API sends in development (password-reset,
  # ADR-018): with no SMTP_HOST set, the API sends to localhost:1025, and the
  # messages show at http://localhost:8025. Nothing leaves the machine. Bound
  # to loopback only: the UI has no login and will show reset links.
  mailpit:
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  postgres-data:
