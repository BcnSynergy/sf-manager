# Edge proxy (spec `deployment`, "Single public origin"; README "Production
# deployment", step 0). The server's only public entry point: it owns ports
# 80 and 443, obtains and renews the HTTPS certificate of every site,
# redirects plain HTTP to HTTPS and forwards each site to its stack's `web`
# service over the shared `sf-edge` network. Each stack's own Caddy (the `web` service) serves
# the app behind it, with the security headers, on plain HTTP and publishes
# no port. Start it once, before any stack, from the repository root:
#   docker compose -f deploy/edge/docker-compose.yml --env-file deploy/edge/edge.env up -d
# It does not change with a deploy, so deploys never restart it. After a
# change here, add --force-recreate: Caddy does not reload the mounted
# Caddyfile on its own.
name: sf-edge

services:
  caddy:
    # Same image as the web app's Caddy (apps/web/Dockerfile), so both move
    # together.
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    environment:
      SFMANAGER_SITE: ${SFMANAGER_SITE:?set SFMANAGER_SITE in edge.env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and their account keys; losing them forces new ones.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - sf-edge

networks:
  # Created by this project; each stack's docker-compose file joins it as an
  # external network, so the edge proxy must be started first.
  sf-edge:
    name: sf-edge

volumes:
  caddy-data:
  caddy-config:
