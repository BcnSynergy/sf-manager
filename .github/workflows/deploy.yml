name: Deploy

# Deploys a commit of main to production or to the public demo (EN-185,
# demo-instance T3; spec `deployment`, "Deploy from CI"; README "Deploying
# from CI"). Started by hand only. The job waits for approval in the GitHub
# environment named after the target (`production` or `demo`), which holds
# that target's deploy secrets, so only an approved run can read them. Each
# target has its own key, whose forced command fixes the target on the
# server. To deploy every green main automatically instead, change the
# trigger; the job stays the same.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [production, demo]
        default: production
      commit:
        description: Commit of main to deploy (SHA); empty deploys the current main
        required: false
        default: ''

permissions:
  contents: read

# One deploy per target at a time; a second one waits instead of cancelling
# the first. Production and the demo deploy independently.
concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    # Forks would deploy to a server they do not run.
    if: github.repository == 'BcnSynergy/sf-manager'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET: ${{ inputs.target }}
      SITE_URL: ${{ inputs.target == 'demo' && 'https://sfmanager.demo.bcnsynergy.com' || 'https://sfmanager.bcnsynergy.com' }}
    environment:
      name: ${{ inputs.target }}
      url: ${{ inputs.target == 'demo' && 'https://sfmanager.demo.bcnsynergy.com' || 'https://sfmanager.bcnsynergy.com' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the commit
        id: commit
        env:
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          sha=$(sh deploy/resolve-commit.sh "$INPUT_COMMIT" 2>resolve.err) || {
            # One line: a newline in the input must not start a new
            # workflow command.
            echo "::error::$(tr '\r\n' '  ' <resolve.err)"
            exit 1
          }
          # Same short form as deploy/deploy.sh on the server.
          short=$(printf %s "$sha" | cut -c1-7)
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "short=$short" >>"$GITHUB_OUTPUT"
          echo "Deploying $sha (sha-$short) to $TARGET" >>"$GITHUB_STEP_SUMMARY"
      # CI publishes images only for commits that were green on main, so a
      # missing image means the commit never passed (or publish failed).
      - name: Check the images were published
        env:
          SHORT: ${{ steps.commit.outputs.short }}
        run: |
          for app in api web; do
            image="ghcr.io/bcnsynergy/sf-manager-$app:sha-$SHORT"
            docker buildx imagetools inspect "$image" >/dev/null || {
              echo "::error::$image is not published; was the commit green on main? (CI uses more than 7 characters when 7 are ambiguous; see README)"
              exit 1
            }
          done
      # The key's authorized_keys entry forces deploy/deploy.sh on the
      # server for this target only, so the commit SHA is the only thing
      # this step can send.
      - name: Deploy on the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_TARGET: ${{ secrets.DEPLOY_SSH_TARGET }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          for name in DEPLOY_SSH_KEY DEPLOY_SSH_KNOWN_HOSTS DEPLOY_SSH_TARGET; do
            [ -n "$(printenv "$name")" ] || {
              echo "::error::secret $name is not set in the $TARGET environment"
              exit 1
            }
          done
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" >"$ssh_dir/key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" >"$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key"
          ssh -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=30 "$DEPLOY_SSH_TARGET" "$SHA"
      - name: Check the deployed site
        run: sh deploy/check-production.sh "$SITE_URL"
