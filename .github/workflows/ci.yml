name: CI

# Merge barrier for main (see docs/adr/ADR-017-ci-merge-barrier.md).
# The job name `ci` is the required status check; renaming it breaks merges
# until branch protection is updated.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    # Raised from 15 for the image build and smoke test (EN-91).
    timeout-minutes: 25
    env:
      # Dummy value for the throwaway service below, not a secret. Prisma's
      # config requires it to be set for every CLI call, including the
      # `prisma generate` inside the build.
      DATABASE_URL: postgresql://sfmanager:sfmanager@localhost:5432/sfmanager
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sfmanager
          POSTGRES_PASSWORD: sfmanager
          POSTGRES_DB: sfmanager
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sfmanager -d sfmanager"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: build
        name: Build
        run: npm run build
      # Test helpers under src/**/testing and the dev seed under
      # src/shared/seeding are excluded from the API build (TD-46), but
      # tsconfig `exclude` does not stop a file that production code imports,
      # so check the emitted output (EN-149, EN-150).
      - name: No test or seed helpers in API build
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          if [ ! -d apps/api/dist ]; then
            echo "::error::apps/api/dist is missing, so the build emitted no API output to check."
            exit 1
          fi
          leaked=$(find apps/api/dist -type f \( -path '*/testing/*' -o -path '*/seeding/*' \))
          if [ -n "$leaked" ]; then
            echo "::error::Test or seed helpers were emitted into apps/api/dist (a production file imports a testing/ or seeding/ module):"
            echo "$leaked"
            exit 1
          fi
      # Test tiers keep running after an earlier tier fails so one run reports
      # every failure, but none of them run when the build fails.
      - name: Lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run lint
      - name: Format
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run format:check
      # The runner image ships ShellCheck (0.9.0 on ubuntu-24.04; README
      # "Images in CI"); `#!/bin/sh` makes it check POSIX sh (EN-105).
      - name: Shellcheck
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: shellcheck deploy/*.sh
      # nest build excludes specs and Jest does not type-check, so this is the
      # only step that type-checks the API's specs (TD-32, TD-36).
      - name: Typecheck
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run typecheck -w apps/api
      - name: Unit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm test
      - name: E2E
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:e2e -w apps/api
      - name: Integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:integration -w apps/api
      # Run the backup and off-site copy scripts against throwaway
      # containers (EN-105).
      - name: Backup script
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: sh deploy/test-postgres-backup.sh
      - name: Off-site copy script
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: sh deploy/test-offsite-copy.sh
      # The scheduled production check (EN-92), against a fake site.
      - name: Production check script
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: sh deploy/test-check-production.sh
      # Builds the production images and starts the whole stack on
      # https://localhost, so a broken Dockerfile or base-image update
      # (Dependabot) fails the PR (EN-91).
      - name: Images
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: sh deploy/smoke-test.sh

  # Publishes the images to GitHub Container Registry once main is green
  # (EN-91). These are the only jobs allowed to write packages; `ci` stays
  # read-only. Each image is published for linux/amd64 and linux/arm64 (the
  # host is an arm64 VM): `publish-platform` builds both images
  # natively on one runner per platform and pushes them by digest, untagged,
  # and `publish` joins the two digests into one multi-platform image. Every
  # green push gets its `sha-<short SHA>` tag; `main` moves only while main
  # still points at this commit, because the ci jobs of two quick merges run
  # in parallel and can finish out of order. If either platform fails, the
  # matrix cancels the other and nothing is tagged: every published tag must
  # hold both platforms (spec `deployment`).
  publish-platform:
    name: publish (${{ matrix.arch }})
    needs: ci
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # The default `docker` driver cannot push an untagged image by digest.
      - name: Set up Buildx
        run: docker buildx create --use --driver docker-container
      - name: Build and push by digest
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p digests
          for app in api web; do
            docker buildx build -f "apps/$app/Dockerfile" \
              --platform "linux/$ARCH" --provenance=false \
              --output "type=image,name=ghcr.io/bcnsynergy/sf-manager-$app,push-by-digest=true,name-canonical=true,push=true" \
              --metadata-file "meta-$app.json" .
            jq -er '."containerimage.digest"' "meta-$app.json" >"digests/$app-$ARCH"
          done
          cat digests/*
      # The smoke test in `ci` runs amd64 only, so check each image once on
      # its own platform: the API must load its native modules (argon2, the
      # Prisma client) and run the Prisma CLI it ships, and Caddy must accept
      # the web image's Caddyfile. Neither starts its server: the API needs a
      # database, which the server deploy proves.
      - name: Check the images on this platform
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          api="ghcr.io/bcnsynergy/sf-manager-api@$(cat "digests/api-$ARCH")"
          web="ghcr.io/bcnsynergy/sf-manager-web@$(cat "digests/web-$ARCH")"
          # prisma.config.ts requires DATABASE_URL; nothing connects to it.
          # --no-install: fail instead of fetching a CLI the image lacks.
          docker run --rm -e DATABASE_URL=postgresql://check@localhost/check "$api" \
            sh -c "node -e \"require('argon2'); require('@prisma/client')\" && npx --no-install prisma --version"
          # The Caddyfile's only placeholder, SITE_ADDRESS, defaults to
          # localhost; the stack's other settings are not read by Caddy.
          docker run --rm "$web" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: digests/
          # Long enough to rerun only the failed `publish` job later.
          retention-days: 7

  publish:
    name: publish
    needs: publish-platform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Create multi-platform images
        run: |
          short=$(git rev-parse --short=7 HEAD)
          source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          for app in api web; do
            image="ghcr.io/bcnsynergy/sf-manager-$app"
            # One digest file per platform: digests/<app>-<arch>. Keep
            # $platforms in step with the publish-platform matrix; a missing
            # or unexpected platform fails here, before any tag moves.
            platforms='amd64 arm64'
            for file in digests/"$app"-*; do
              [ -e "$file" ] || continue
              case " $platforms " in
                *" ${file#"digests/$app-"} "*) ;;
                *) echo "unexpected digest file $file" >&2; exit 1 ;;
              esac
            done
            refs=''
            for arch in $platforms; do
              file="digests/$app-$arch"
              [ -s "$file" ] || { echo "no $arch digest for $app" >&2; exit 1; }
              refs="$refs $image@$(cat "$file")"
            done
            # shellcheck disable=SC2086 # one word per platform image
            docker buildx imagetools create -t "$image:sha-$short" \
              --annotation "index:org.opencontainers.image.source=$source" $refs
            docker buildx imagetools inspect "$image:sha-$short"
            head=$(git ls-remote origin refs/heads/main | cut -f1)
            if [ "$head" = "$GITHUB_SHA" ]; then
              docker buildx imagetools create -t "$image:main" "$image:sha-$short"
            else
              echo "main moved on to $head; its own publish run moves $image:main"
            fi
          done
