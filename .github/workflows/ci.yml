name: CI

# Merge barrier for main (see docs/adr/ADR-017-ci-merge-barrier.md).
# The job name `ci` is the required status check; renaming it breaks merges
# until branch protection is updated.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    # Raised from 15 for the image build and smoke test (EN-91).
    timeout-minutes: 25
    env:
      # Dummy value for the throwaway service below, not a secret. Prisma's
      # config requires it to be set for every CLI call, including the
      # `prisma generate` inside the build.
      DATABASE_URL: postgresql://sfmanager:sfmanager@localhost:5432/sfmanager
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sfmanager
          POSTGRES_PASSWORD: sfmanager
          POSTGRES_DB: sfmanager
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sfmanager -d sfmanager"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: build
        name: Build
        run: npm run build
      # Test tiers keep running after an earlier tier fails so one run reports
      # every failure, but none of them run when the build fails.
      - name: Lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run lint
      - name: Format
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run format:check
      # nest build excludes specs and Jest does not type-check, so this is the
      # only step that type-checks the API's specs (TD-32, TD-36).
      - name: Typecheck
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run typecheck -w apps/api
      - name: Unit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm test
      - name: E2E
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:e2e -w apps/api
      - name: Integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:integration -w apps/api
      # Builds the production images and starts the whole stack on
      # https://localhost, so a broken Dockerfile or base-image update
      # (Dependabot) fails the PR (EN-91).
      - name: Images
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: sh deploy/smoke-test.sh

  # Publishes the images to GitHub Container Registry once main is green
  # (EN-91). It is the only job allowed to write packages; `ci` stays
  # read-only. Every green push gets its `sha-<short SHA>` tag; `main` moves
  # only while main still points at this commit, because the ci jobs of two
  # quick merges run in parallel and can finish out of order.
  publish:
    name: publish
    needs: ci
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push
        run: |
          short=$(git rev-parse --short=7 HEAD)
          for app in api web; do
            image="ghcr.io/bcnsynergy/sf-manager-$app"
            docker build -f "apps/$app/Dockerfile" -t "$image:sha-$short" .
            docker push "$image:sha-$short"
            head=$(git ls-remote origin refs/heads/main | cut -f1)
            if [ "$head" = "$GITHUB_SHA" ]; then
              docker tag "$image:sha-$short" "$image:main"
              docker push "$image:main"
            else
              echo "main moved on to $head; its own publish run moves $image:main"
            fi
          done
