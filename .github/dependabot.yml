# Docker: keeps the digest-pinned base images current (EN-95). Dependabot keeps each
# tag's precision and suffix, so with single-number tags (`24-bookworm-slim`,
# `2-alpine`, `18-alpine`) and majors ignored it only proposes a new digest
# for the same tag; nothing merges on its own. Majors are ignored because a
# Postgres major needs a dump and restore of the data volume, and Node or
# Caddy majors are a deliberate, manual upgrade. A new Debian release
# (bookworm to trixie) changes the tag suffix, which Dependabot never does,
# so that is manual too. The rclone image (`offsite` service) uses a full
# version tag, so for it Dependabot also proposes minor and patch versions.
# CI's Postgres service image (.github/workflows/ci.yml) is not covered
# (EN-107).
#
# npm and GitHub Actions (TD-32): minor and patch updates arrive as one
# grouped PR per ecosystem each week. npm majors arrive as separate PRs,
# since each may need code changes; none merges on its own.
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: weekly
    # One PR per image across both Dockerfiles, so api and web never sit on
    # different node digests between two PRs.
    groups:
      base-images:
        patterns: ['*']
        group-by: dependency-name
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
