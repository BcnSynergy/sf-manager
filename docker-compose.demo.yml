# Public demo stack (README "Demo stack"; spec `deployment`, "Demo stack").
# An override of docker-compose.prod.yml run as its own Compose project, with
# its own database, uploaded files and settings (demo.env), behind the same
# edge proxy on its own edge network:
#   docker compose -p sf-manager-demo -f docker-compose.prod.yml \
#     -f docker-compose.demo.yml --env-file demo.env up -d --no-build
# demo.env sets EDGE_NETWORK=sf-edge-demo and WEB_ALIAS=sf-manager-demo-web,
# so its web joins the demo's edge network only (deploy/edge). It holds the
# fictitious demo dataset (spec `demo-seed-data`), reset every night, and it
# sends no email, keeps no backups and makes no off-site copies.
services:
  api:
    environment: &no-email
      # No email leaves the demo: the API requires a relay in production, so
      # it gets one nobody listens on, and a password reset request fails
      # quietly (it is logged, the response does not change). The demo
      # accounts' addresses are at a reserved .example domain anyway.
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '25'
      SMTP_USER: demo
      SMTP_PASSWORD: demo
      SMTP_FROM: SF-Manager demo <no-reply@demo.sf-manager.example>

  # The demo keeps no backups and makes no off-site copies: every night
  # restores the same dataset anyway. A profile nobody enables keeps them off.
  backup:
    profiles: [never]
  offsite:
    profiles: [never]

  # Resets the demo when it starts and every night (deploy/demo-reset.sh):
  # drops the schema, migrates, empties the uploaded files and seeds the
  # admin and the demo dataset again.
  reset:
    image: ghcr.io/bcnsynergy/sf-manager-api:${IMAGE_TAG:-local}
    restart: unless-stopped
    # The script sleeps until the next reset; see the backup service.
    init: true
    # The API applies the migrations when it starts; the first reset waits
    # for it, so both never migrate at once.
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *no-email
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      # The seed boots the API's application context, which needs these.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in demo.env}
      THROTTLE_KEY_SECRET: ${THROTTLE_KEY_SECRET:?set THROTTLE_KEY_SECRET in demo.env}
      CORS_ORIGIN: https://${SITE_ADDRESS:?set SITE_ADDRESS in demo.env}
      # The demo's system admin, seeded again on every reset. Unlike
      # production's, this long-running service holds its password.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?set SEED_ADMIN_EMAIL in demo.env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in demo.env}
      SEED_DEMO_DATA: 'true'
      DEMO_RESET_HOUR_UTC: ${DEMO_RESET_HOUR_UTC:-3}
    entrypoint: ['/bin/sh', '/usr/local/bin/demo-reset.sh']
    volumes:
      - api-files:/var/lib/sf-manager/files
      - ./deploy/demo-reset.sh:/usr/local/bin/demo-reset.sh:ro
