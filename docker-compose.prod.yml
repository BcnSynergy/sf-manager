# Production stack (README "Production deployment"; spec `deployment`).
#   docker compose -f docker-compose.prod.yml --env-file prod.env up -d --build
# The dev stack (docker-compose.yml) is a separate project, so both can run
# on one machine without sharing containers or volumes.
name: sf-manager-prod

services:
  postgres:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in prod.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in prod.env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in prod.env}
    # No published port: only the API reaches the database.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # Node as PID 1 ignores SIGTERM, so without an init process every stop or
    # upgrade waits for the timeout and then kills the API.
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in prod.env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      CORS_ORIGIN: https://${SITE_ADDRESS:?set SITE_ADDRESS in prod.env}
      # TD-5: the refresh cookie is scoped to the auth routes as the browser
      # sees them, and Caddy serves the API under /api.
      REFRESH_TOKEN_COOKIE_PATH: /api/auth
      REFRESH_TOKEN_IDLE_TTL: ${REFRESH_TOKEN_IDLE_TTL:-8h}
      REFRESH_TOKEN_ABSOLUTE_TTL: ${REFRESH_TOKEN_ABSOLUTE_TTL:-7d}
      # Caddy is the only hop in front of the API (ADR-011 open question 1).
      TRUST_PROXY: '1'
      # Swagger UI at /api/docs lists every route and schema (TD-40).
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      # SEED_ADMIN_EMAIL/SEED_ADMIN_PASSWORD are deliberately absent: the
      # one-off admin seed run passes them with `-e` (README), so the
      # long-running API never holds the admin password.
    volumes:
      # Uploaded files (the organization logo). The image sets
      # FILE_STORAGE_DIR to this path. The backup service archives it (TD-42).
      - api-files:/var/lib/sf-manager/files
    # No published port: Caddy forwards /api/* to it.

  # Daily pg_dump and uploaded-files archive into ./backups on the host
  # (TD-41, TD-42). Copying them off the server is the operator's job
  # (README "Database backups").
  backup:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    # The script sleeps between dumps; without an init process a stop waits
    # for the timeout and then kills it.
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    entrypoint: ['/bin/sh', '/usr/local/bin/postgres-backup.sh']
    volumes:
      - ./backups:/backups
      # Writable: restore replaces the uploaded files with an archive.
      - api-files:/files
      - ./deploy/postgres-backup.sh:/usr/local/bin/postgres-backup.sh:ro

  # Hourly encrypted copy of ./backups to an S3-compatible bucket (EN-104).
  # Off until every OFFSITE_* variable is set in prod.env; README "Off-site
  # copies".
  offsite:
    image: rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
    restart: unless-stopped
    # The script sleeps between copies; see the backup service.
    init: true
    environment:
      OFFSITE_S3_ENDPOINT: ${OFFSITE_S3_ENDPOINT:-}
      OFFSITE_S3_BUCKET: ${OFFSITE_S3_BUCKET:-}
      OFFSITE_S3_ACCESS_KEY_ID: ${OFFSITE_S3_ACCESS_KEY_ID:-}
      OFFSITE_S3_SECRET_ACCESS_KEY: ${OFFSITE_S3_SECRET_ACCESS_KEY:-}
      OFFSITE_S3_PROVIDER: ${OFFSITE_S3_PROVIDER:-Other}
      OFFSITE_S3_REGION: ${OFFSITE_S3_REGION:-auto}
      OFFSITE_ENCRYPTION_PASSWORD: ${OFFSITE_ENCRYPTION_PASSWORD:-}
    entrypoint: ['/bin/sh', '/usr/local/bin/offsite-copy.sh']
    volumes:
      # Writable: pull downloads the copies into it.
      - ./backups:/backups
      - ./deploy/offsite-copy.sh:/usr/local/bin/offsite-copy.sh:ro

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      # Certificates and their account keys; losing them forces new ones.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  api-files:
  caddy-data:
  caddy-config:
